[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-finbert"
version = "0.1.0"
description = "Self-hosted FinBERT sentiment API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bottle>=0.13",
  "waitress>=3.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "transformers>=4.44",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "webtest>=3",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
